<!-- DEPENDENCY MANAGER & VAULT MODAL -->
<div id="dependency-modal" class="modal-overlay">
  <div class="modal" style="max-width: min(calc(620px * var(--ui-scale, 1)), 94vw); width: 94vw;">
    <div class="modal-header">
      <div style="display:flex; align-items:center; gap:calc(10px * var(--ui-scale, 1));">
        <span id="dep-modal-icon" style="font-size:calc(18px * var(--ui-scale, 1));">⚡</span>
        <h3 id="dep-modal-title" style="margin:0; font-size:var(--text-lg, 16px); font-weight:700;">Dependency Manager</h3>
      </div>
      <button class="modal-close-btn" id="dependency-modal-close-x">✕</button>
    </div>
    <div class="modal-body" style="padding:calc(14px * var(--ui-scale, 1)) calc(18px * var(--ui-scale, 1)); display:flex; flex-direction:column; gap:calc(14px * var(--ui-scale, 1));">
      
      <!-- Current Status & Remote Version Hero Card -->
      <div class="settings-group" style="background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:calc(12px * var(--ui-scale, 1)) calc(16px * var(--ui-scale, 1)); display:flex; flex-direction:column; gap:calc(10px * var(--ui-scale, 1));">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div style="display:flex; flex-direction:column; gap:2px;">
            <span style="font-size:var(--text-xs, 11px); text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted);" data-i18n="dependencies.current_installed">Currently Installed</span>
            <div style="display:flex; align-items:center; gap:calc(8px * var(--ui-scale, 1));">
              <span id="dep-current-version" style="font-size:var(--text-lg, 16px); font-weight:700; color:var(--text-primary);">--</span>
              <span id="dep-status-badge" class="badge" style="font-size:var(--text-xs, 11px); padding:2px calc(8px * var(--ui-scale, 1)); border-radius:4px;">Checking</span>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:2px; text-align:right;">
            <span style="font-size:var(--text-xs, 11px); text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted);" data-i18n="dependencies.latest_remote">Latest Release</span>
            <span id="dep-remote-version" style="font-size:var(--text-md, 14px); font-weight:600; color:var(--accent);">--</span>
          </div>
        </div>

        <!-- Quick Action Bar -->
        <div style="display:flex; align-items:center; justify-content:space-between; gap:calc(10px * var(--ui-scale, 1)); border-top:1px solid var(--border); padding-top:calc(10px * var(--ui-scale, 1)); margin-top:2px;">
          <button id="dep-btn-download-latest" class="btn-primary" style="font-size:var(--text-sm, 12px); padding:calc(6px * var(--ui-scale, 1)) calc(14px * var(--ui-scale, 1)); display:flex; align-items:center; gap:calc(6px * var(--ui-scale, 1));">
            <span>⬇</span> <span data-i18n="dependencies.download_latest">Download Latest</span>
          </button>
          <div style="display:flex; align-items:center; gap:calc(8px * var(--ui-scale, 1));">
            <button id="dep-btn-custom-zip" class="btn-secondary" style="font-size:var(--text-xs, 11px); padding:calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1)); display:flex; align-items:center; gap:calc(5px * var(--ui-scale, 1));" title="Install directly from a custom local ZIP file">
              <span>📦</span> <span data-i18n="dependencies.install_custom_zip">Install from ZIP...</span>
            </button>
            <button id="dep-btn-open-vault" class="btn-secondary" style="font-size:var(--text-xs, 11px); padding:calc(6px * var(--ui-scale, 1)) calc(10px * var(--ui-scale, 1));" title="Open Vault folder in Explorer">
              <span>📁</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Local Vault Section -->
      <div style="display:flex; flex-direction:column; gap:calc(8px * var(--ui-scale, 1));">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-weight:700; font-size:var(--text-base, 13px); color:var(--text-primary);" data-i18n="dependencies.vault_title">Local Version Vault</span>
          <span id="dep-vault-count" style="font-size:var(--text-xs, 11px); color:var(--text-muted);">0 cached versions</span>
        </div>
        <div class="settings-hint" style="font-size:var(--text-xs, 11px); color:var(--text-muted);" data-i18n="dependencies.vault_desc">
          Archived installer packages kept locally. Roll back instantly if a new version causes issues.
        </div>
        <div id="dep-vault-list" style="display:flex; flex-direction:column; gap:calc(8px * var(--ui-scale, 1)); max-height:calc(220px * var(--ui-scale, 1)); overflow-y:auto; padding-right:4px; margin-top:4px;">
          <!-- Populated dynamically with version cards -->
        </div>
      </div>

    </div>
    <div class="modal-footer" style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:calc(8px * var(--ui-scale, 1));">
        <button id="dep-btn-uninstall" class="btn-danger-subtle" style="font-size:var(--text-xs, 11px); padding:calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1)); color:#ff4a4a; background:transparent; border:1px solid rgba(255,74,74,0.3); border-radius:4px; cursor:pointer;" data-i18n="common.uninstall">Uninstall</button>
        <button id="dep-btn-view-log" class="btn-secondary" style="font-size:var(--text-xs, 11px); padding:calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1)); display:none; align-items:center; gap:calc(5px * var(--ui-scale, 1));" title="View UE4SS Runtime Log" data-i18n-title="ue4ss_log.btn_open_tooltip">
          <span>📜</span> <span data-i18n="ue4ss_log.btn_open">UE4SS Log</span>
        </button>
      </div>
      <button id="dependency-modal-close" class="btn-secondary" data-i18n="common.close">Close</button>
    </div>
  </div>
</div>
