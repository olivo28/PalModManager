<!-- PROFILE MANAGER MODAL -->
<div id="profile-modal" class="modal-overlay">
  <div class="modal" style="max-width:620px; width:100%;">
    <div class="modal-header">
      <h3 data-i18n="profiles.title">Manage Profiles</h3>
      <button class="modal-close-btn" id="profile-modal-close-x">✕</button>
    </div>
    <div class="modal-body">
      <div id="profile-list"></div>
      <div class="profile-add-row">
        <input type="text" id="profile-new-name" placeholder="New profile name..." data-i18n-placeholder="profiles.new_placeholder" />
        <button id="profile-create-btn" class="btn-primary" data-i18n="profiles.btn_create">Create</button>
      </div>
    </div>
    <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
      <button id="profile-import-btn" class="btn-secondary" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-weight:600;" data-i18n="profiles.btn_import_pack">📥 Import Co-op Pack</button>
      <button id="profile-modal-close" class="btn-secondary" data-i18n="common.close">Close</button>
    </div>
  </div>
</div>
