<!-- INSTALL MODAL -->
<div id="install-modal" class="modal-overlay">
  <div class="modal" style="width: min(calc(750px * var(--ui-scale, 1)), 94vw); max-width: 94vw;">
    <div class="modal-header">
      <h3 id="install-modal-title" data-i18n="installer.modal_title_install">Install Mod</h3>
      <button id="modal-close-x" class="modal-close-btn" data-i18n-title="common.close">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:calc(12px * var(--ui-scale, 1));padding:calc(18px * var(--ui-scale, 1));overflow:hidden;">
      <div id="modal-content" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
      <div id="modal-status" style="font-size:var(--text-sm, 12px);font-weight:600;color:var(--text-muted);margin-top:6px;"></div>
    </div>
    <div class="modal-footer" style="padding:calc(12px * var(--ui-scale, 1)) calc(18px * var(--ui-scale, 1));">
      <button id="modal-cancel" class="btn-secondary" data-i18n="common.cancel">Cancel</button>
      <button id="modal-install-deps-retry" class="btn-primary" style="display:none;background:#e0af68;color:#000;" data-i18n="installer.btn_retry_deps">Install Deps & Retry</button>
      <button id="modal-confirm" class="btn-primary" disabled data-i18n="common.install">Install</button>
    </div>
  </div>
</div>
