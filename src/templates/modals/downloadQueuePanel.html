<!-- FLOATING DOWNLOAD TRAY -->
<div id="nxm-download-tray" class="hidden">
  <div class="nxm-tray-header" id="nxm-tray-header-toggle">
    <div class="nxm-tray-title">
      <svg class="pmm-icon pmm-icon-xs" viewBox="0 0 24 24" style="color:var(--accent);"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span data-i18n="nxm_queue.panel_title">Downloads</span>
      <span class="nxm-tray-badge" id="nxm-tray-badge-count">0</span>
    </div>
    <div class="nxm-tray-controls">
      <button type="button" class="nxm-tray-btn" id="nxm-tray-toggle-collapse" title="Collapse / Expand" data-i18n-title="nxm_queue.btn_collapse"><svg class="pmm-icon pmm-icon-xs" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></button>
      <button type="button" class="nxm-tray-btn" id="nxm-tray-close" title="Close" data-i18n-title="common.close"><svg class="pmm-icon pmm-icon-xs" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </div>
  <div id="nxm-download-body">
    <!-- Queue Items Rendered Dynamically -->
  </div>
</div>
