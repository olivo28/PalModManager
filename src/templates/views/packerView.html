<!-- BUILD / PACKER TAB -->
<div id="build-view" class="tab-content" style="display:none; flex-direction: column; width: 100%; height: 100%;">
  <!-- View 1: Projects Hub (Grid/Dashboard) -->
  <div id="packer-projects-hub"
    style="display: flex; flex-direction: column; width: 100%; height: 100%; overflow: hidden;">
    <div class="packer-toolbar">
      <span class="packer-toolbar-title" data-i18n="packer.hub_title">Mod Packer Workspace</span>
      <button id="packer-hub-new-btn" class="toolbar-btn toolbar-btn-primary"
        style="font-size: var(--text-sm, 12px); padding: calc(6px * var(--ui-scale, 1)) calc(12px * var(--ui-scale, 1)); line-height: 1;"
        data-i18n="packer.btn_new_project">+ Create New Project</button>
    </div>
    <div id="packer-projects-grid" class="packer-projects-grid" style="flex: 1;">
      <!-- Project folder cards populated dynamically -->
    </div>
  </div>

  <!-- View 2: Active Workspace (Staging Area) -->
  <div id="packer-workspace-view"
    style="display: none; flex-direction: row; width: 100%; height: 100%; overflow: hidden;">
    <div class="packer-left">
      <div class="packer-toolbar">
        <button id="packer-workspace-back-btn" class="toolbar-btn-sm" style="margin-right: 8px;"
          data-i18n="packer.btn_back_projects">← Projects</button>
        <span id="packer-workspace-title" class="packer-toolbar-title" data-i18n="packer.workspace_title">Staged
          Files</span>
        <div id="packer-layout-toggle-bar" style="display:flex;align-items:center;gap:4px;margin-right:8px;">
          <button id="packer-view-list-btn" class="layout-btn active" title="List View"
            data-i18n-title="packer.view_list_title"><svg width="13" height="13" viewBox="0 0 16 16"
              fill="currentColor">
              <path d="M1 2.5h14v2H1v-2zm0 4.5h14v2H1V7zm0 4.5h14v2H1v-2z" />
            </svg></button>
          <button id="packer-view-tree-btn" class="layout-btn" title="Tree View"
            data-i18n-title="packer.view_tree_title"><svg width="13" height="13" viewBox="0 0 16 16"
              fill="currentColor">
              <path d="M1 1h6v6H1V1zm8 0h6v6H9V1zm-8 8h6v6H1V9zm8 0h6v6H9V9z" />
            </svg></button>
        </div>
        <button id="packer-add-files-btn" class="toolbar-btn-sm" data-i18n="packer.btn_add_files">+ Add Files</button>
        <button id="packer-add-folder-btn" class="toolbar-btn-sm btn-with-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon pmm-icon-xs" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg><span data-i18n="packer.btn_add_folder">Add Folder</span></button>
        <button id="packer-new-virtual-folder-btn" class="toolbar-btn-sm btn-with-icon" style="display:none;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon pmm-icon-xs" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span data-i18n="packer.btn_new_virtual_folder">New Folder</span></button>
        <button id="packer-autostruct-btn" class="toolbar-btn-sm" style="background:var(--accent);color:#fff;"
          data-i18n="packer.btn_auto_struct">Auto-Structure</button>
        <button id="packer-preview-install-btn" class="toolbar-btn-sm btn-with-icon" data-i18n-title="packer.btn_preview_install_title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon pmm-icon-xs" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="packer.btn_preview_install">Preview Install</span></button>
        <button id="packer-clear-btn" class="toolbar-btn-sm" data-i18n="packer.btn_clear_all">Clear All</button>
      </div>
      <div id="packer-files-container" class="packer-files-container">
        <table id="packer-list-table" class="packer-table">
          <thead>
            <tr>
              <th style="width: 36%;" data-i18n="packer.col_source_file">Source File</th>
              <th style="width: 70px;" data-i18n="packer.col_size">Size</th>
              <th style="width: 56%;" data-i18n="packer.col_target_path">Archive Target Path</th>
              <th style="width: 65px; text-align: right;"></th>
            </tr>
          </thead>
          <tbody id="packer-files-body">
            <!-- Staged files populated dynamically -->
          </tbody>
        </table>
        <div id="packer-tree-view" style="display:none; padding: 12px; height: 100%; overflow-y: auto;">
          <!-- Hierarchical files tree populated dynamically -->
        </div>
        <div id="packer-empty-state" class="packer-empty-state">
          <span class="packer-empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" style="width:44px;height:44px;opacity:0.4;" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
          <strong data-i18n="packer.empty_state_title">Workspace is Empty</strong>
          <span data-i18n="packer.empty_state_desc">Drag & drop files or folders here, or use the "Add Files" button to
            begin staging.</span>
        </div>
      </div>
      <div id="packer-drag-overlay" class="packer-drop-overlay">
        <div class="packer-drop-overlay-content btn-with-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" style="width:24px;height:24px;" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span data-i18n="packer.drop_overlay">Drop files here to stage</span></div>
      </div>
    </div>
    <div class="packer-right">
      <div class="packer-form-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span data-i18n="packer.save_options_title">Project Save Options</span>
        <button id="packer-workspace-delete-btn" class="btn-tiny"
          style="background:var(--danger-dim);color:var(--danger);border:none;padding: calc(4px * var(--ui-scale, 1)) calc(8px * var(--ui-scale, 1)); font-size: var(--text-xs, 11px); border-radius: 4px;"
          title="Delete Project" data-i18n-title="packer.btn_delete_project_title"
          data-i18n="common.delete">Delete</button>
      </div>
      <div class="packer-form-group"
        style="margin-bottom: calc(12px * var(--ui-scale, 1)); display: flex; flex-direction: row; gap: calc(6px * var(--ui-scale, 1));">
        <input type="text" id="packer-project-name" class="packer-form-input"
          style="flex: 1; padding: calc(4px * var(--ui-scale, 1)) calc(8px * var(--ui-scale, 1)); font-size: var(--text-sm, 12px); height: calc(30px * var(--ui-scale, 1)); box-sizing: border-box;"
          placeholder="Project Name..." data-i18n-placeholder="packer.project_name_placeholder" />
        <button id="packer-project-save-btn" class="toolbar-btn-sm"
          style="padding: calc(4px * var(--ui-scale, 1)) calc(10px * var(--ui-scale, 1)); height: calc(30px * var(--ui-scale, 1)); font-size: var(--text-sm, 12px);"
          data-i18n="common.save">Save</button>
      </div>

      <div class="packer-form-header" data-i18n="packer.metadata_title">Mod Metadata</div>
      <div class="packer-form-group">
        <label for="packer-meta-name" data-i18n="packer.label_mod_name">Mod Name</label>
        <input type="text" id="packer-meta-name" class="packer-form-input" placeholder="e.g. MyAmazingMod"
          data-i18n-placeholder="packer.placeholder_mod_name" />
      </div>
      <div class="packer-form-group">
        <label for="packer-meta-version" data-i18n="packer.label_version">Version</label>
        <input type="text" id="packer-meta-version" class="packer-form-input" placeholder="e.g. 1.0.0" value="1.0.0"
          data-i18n-placeholder="packer.placeholder_version" />
      </div>
      <div class="packer-form-group">
        <label for="packer-meta-author" data-i18n="packer.label_author">Author</label>
        <input type="text" id="packer-meta-author" class="packer-form-input" placeholder="e.g. CreatorName"
          data-i18n-placeholder="packer.placeholder_author" />
      </div>
      <div class="packer-form-group">
        <label for="packer-meta-nexus-id" data-i18n="packer.label_nexus_id">Nexus ID</label>
        <input type="number" id="packer-meta-nexus-id" class="packer-form-input" placeholder="e.g. 1234 (Optional)"
          min="1" step="1" data-i18n-placeholder="packer.placeholder_nexus_id" />
      </div>
      <div class="packer-form-group">
        <label for="packer-meta-type" data-i18n="packer.label_mod_type">Mod Type</label>
        <select id="packer-meta-type" class="packer-form-select">
          <option value="" data-i18n="packer.select_type_placeholder">Select type...</option>
          <option value="ue4ss" data-i18n="packer.type_opt_ue4ss">UE4SS Mod</option>
          <option value="palschema" data-i18n="packer.type_opt_palschema">PalSchema Mod</option>
          <option value="pak" data-i18n="packer.type_opt_pak">Pak Mod (~mods)</option>
          <option value="logicmods" data-i18n="packer.type_opt_logicmods">LogicMods (~mods/LogicMods)</option>
          <option value="hybrid" data-i18n="packer.type_opt_hybrid">Hybrid Mod</option>
        </select>
      </div>
      <div class="packer-form-group">
        <label for="packer-meta-desc" data-i18n="packer.label_description">Description</label>
        <textarea id="packer-meta-desc" class="packer-form-textarea" placeholder="Describe what your mod does..."
          data-i18n-placeholder="packer.placeholder_desc"></textarea>
      </div>
      <div class="packer-form-header" style="margin-top: calc(10px * var(--ui-scale, 1));"
        data-i18n="packer.export_presets_title">Compatibility & Presets</div>
      <div class="packer-form-group" style="margin-bottom: calc(6px * var(--ui-scale, 1));">
        <label
          style="display: flex; align-items: center; gap: calc(8px * var(--ui-scale, 1)); cursor: pointer; font-size: var(--text-sm, 12.5px); text-transform: none; letter-spacing: normal; color: var(--text-primary);">
          <input type="checkbox" id="packer-preset-vortex"
            style="cursor: pointer; width: calc(15px * var(--ui-scale, 1)); height: calc(15px * var(--ui-scale, 1));" />
          <span data-i18n="packer.opt_vortex_structure">Vortex / Manual Root Structure</span>
        </label>
      </div>
      <div class="packer-form-group" style="margin-bottom: calc(12px * var(--ui-scale, 1));">
        <label
          style="display: flex; align-items: center; gap: calc(8px * var(--ui-scale, 1)); cursor: pointer; font-size: var(--text-sm, 12.5px); text-transform: none; letter-spacing: normal; color: var(--text-primary);">
          <input type="checkbox" id="packer-preset-dual"
            style="cursor: pointer; width: calc(15px * var(--ui-scale, 1)); height: calc(15px * var(--ui-scale, 1));" />
          <span data-i18n="packer.opt_dual_zip">Dual Package (Steam Win64 + Xbox WinGDK)</span>
        </label>
      </div>
      <div class="packer-format-row">
        <select id="packer-format-select" class="packer-select-format">
          <option value="zip">.zip</option>
          <option value="7z">.7z</option>
          <option value="rar">.rar</option>
        </select>
        <button id="packer-build-btn" class="packer-btn-build btn-with-icon" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" stroke-width="2"><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
          <span data-i18n="packer.btn_build">Package Mod</span>
        </button>
      </div>
    </div>
  </div>
</div>
