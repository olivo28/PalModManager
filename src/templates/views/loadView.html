<!-- LOAD TAB -->
<div id="load-view" class="tab-content" style="display:none; flex-direction:column; height: 100%; overflow: hidden;">
  <div id="load-toolbar" style="display:flex;align-items:center;padding:12px 16px;background:var(--bg-primary);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;">
    <span style="font-size:13px;font-weight:700;color:var(--text-primary)" data-i18n="load.title">Mods Load Order</span>
    <div class="settings-hint" style="margin-left:8px; font-size:11px; color:var(--text-muted);" data-i18n="load.hint">
      Drag and drop mods in their respective columns to reorder. Toggles enable or disable them.
    </div>
  </div>
  <div id="load-list-container" style="flex:1; display:flex; flex-direction:row; gap:20px; padding:16px; min-height:0; overflow:hidden; width:100%;">
    <!-- Dynamically populated list of draggable cards -->
  </div>
</div>
