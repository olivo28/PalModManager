<!-- MODS TAB -->
<div id="mods-view" class="tab-content">
  <div id="toolbar">
    <span id="game-platform-badge" class="game-platform-badge" style="display:none"></span>
    <span id="game-version-badge" class="game-version-badge"></span>
    <span id="ue4ss-badge" class="dep-badge" style="display:none"></span>
    <span id="palschema-badge" class="dep-badge" style="display:none"></span>
    <div id="quick-filter-bar">
      <button class="quick-filter-btn active" data-filter="ue4ss" data-i18n="mods.quick_filter_ue4ss">UE4SS</button>
      <button class="quick-filter-btn active" data-filter="palschema" data-i18n="mods.quick_filter_palschema">PalSchema</button>
      <button class="quick-filter-btn active" data-filter="pak" data-i18n="mods.quick_filter_pak">Pak</button>
      <button class="quick-filter-btn active" data-filter="logicmods" data-i18n="mods.quick_filter_logicmods">LogicMods</button>
      <button class="quick-filter-btn active" data-filter="hybrid" data-i18n="mods.quick_filter_hybrid">Hybrid</button>
      <span class="quick-filter-sep"></span>
      <button id="advanced-filter-btn" class="quick-filter-btn advanced" title="Advanced filters" data-i18n-title="mods.filter_advanced_title">▼</button>
      <div id="advanced-filter-dropdown" class="filter-dropdown" style="display:none;">
        <div class="filter-dropdown-header" data-i18n="mods.filter_tags_header">Tags</div>
        <div id="filter-tags-list"></div>
        <div class="filter-dropdown-header" style="margin-top:8px" data-i18n="mods.filter_categories_header">Categories</div>
        <div id="filter-cats-list"></div>
      </div>
      <span class="quick-filter-sep"></span>
      <div id="status-filter-bar">
        <button class="status-filter-btn active" data-status="all" title="Show All Mods" data-i18n-title="mods.status_all_title" data-i18n="common.all">All</button>
        <button class="status-filter-btn" data-status="enabled" title="Show Enabled Mods Only" data-i18n-title="mods.status_on_title" data-i18n="common.on">On</button>
        <button class="status-filter-btn" data-status="disabled" title="Show Disabled Mods Only" data-i18n-title="mods.status_off_title" data-i18n="common.off">Off</button>
        <button class="status-filter-btn" data-status="tracked" title="Show Tracked Mods" data-i18n-title="mods.status_tracked_title" data-i18n="mods.status_tracked">Tracked</button>
        <button class="status-filter-btn" data-status="endorsed" title="Show Endorsed Mods" data-i18n-title="mods.status_endorsed_title" data-i18n="mods.status_endorsed">Endorsed</button>
        <button class="status-filter-btn" data-status="unendorsed" title="Show Unendorsed Nexus Mods" data-i18n-title="mods.status_unendorsed_title" data-i18n="mods.status_unendorsed">Unendorsed</button>
      </div>
    </div>
    <div id="search-wrap">
      <input type="text" id="search-input" placeholder="Search mods..." title="Filter mods by name or author" data-i18n-placeholder="mods.search_placeholder" data-i18n-title="mods.search_title" />
    </div>
    <div id="sort-bar">
      <select id="sort-select" class="sort-select" title="Select mod sorting order" data-i18n-title="mods.sort_select_title">
        <option value="name:asc" data-i18n="mods.sort_name_asc">Name (A → Z)</option>
        <option value="name:desc" data-i18n="mods.sort_name_desc">Name (Z → A)</option>
        <option value="date:desc" data-i18n="mods.sort_date_desc">Date (Newest First)</option>
        <option value="date:asc" data-i18n="mods.sort_date_asc">Date (Oldest First)</option>
        <option value="type:asc" data-i18n="mods.sort_type_asc">Type (UE4SS / Pak / etc.)</option>
        <option value="status:desc" data-i18n="mods.sort_status_desc">Status (Active First)</option>
      </select>
    </div>
    <div id="layout-toggle-bar" style="display:flex;align-items:center;gap:4px;">
      <button id="layout-grid-btn" class="layout-btn active" title="Grid View (Cards)" data-i18n-title="mods.layout_grid_title"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1 1h6v6H1V1zm8 0h6v6H9V1zm-8 8h6v6H1V9zm8 0h6v6H9V9z"/></svg></button>
      <button id="layout-list-btn" class="layout-btn" title="List View (Details Table)" data-i18n-title="mods.layout_list_title"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2.5h14v2H1v-2zm0 4.5h14v2H1V7zm0 4.5h14v2H1v-2z"/></svg></button>
    </div>
    <span id="profile-active-label" class="profile-active-indicator" title="Current active profile">Profile: Default</span>
    <button id="profile-manager-btn" class="toolbar-btn-sm" title="Manage profiles (create, switch, duplicate)" data-i18n-title="mods.btn_profiles_title" data-i18n="mods.btn_profiles">Profiles</button>
    <button id="new-folder-btn" class="toolbar-btn-sm" title="Create virtual group folder" data-i18n-title="mods.btn_new_folder_title" data-i18n="mods.btn_new_folder">New Folder</button>
    <div id="toolbar-actions">
      <button id="scan-btn" class="toolbar-btn" title="Rescan mod directories and game files" data-i18n-title="mods.btn_scan_title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg></button>
      <button id="install-btn" class="toolbar-btn toolbar-btn-primary" title="Install mod from .zip archive" data-i18n-title="mods.btn_install_title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" stroke-width="2.5"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button id="check-updates-btn" class="toolbar-btn" title="Check for mod updates" data-i18n-title="mods.btn_check_updates_title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      <button id="open-all-updates-btn" class="toolbar-btn btn-with-icon" title="Open all Nexus update pages in browser" data-i18n-title="mods.btn_open_all_updates_title" style="display:none;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="pmm-icon" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span data-i18n="mods.btn_open_all_updates">Open Updates</span></button>
      <span class="quick-filter-sep"></span>
      <button id="disable-all-btn" class="toolbar-btn-sm" title="Disable all active mods in current profile" data-i18n-title="mods.btn_disable_all_title" data-i18n="mods.btn_disable_all">All Off</button>
      <button id="enable-all-btn" class="toolbar-btn-sm" title="Enable all mods in current profile" data-i18n-title="mods.btn_enable_all_title" data-i18n="mods.btn_enable_all">All On</button>
      <span class="quick-filter-sep"></span>
      <button id="export-json-btn" class="toolbar-btn-sm" title="Export all mod data as JSON" data-i18n-title="mods.btn_export_json_title" data-i18n="mods.btn_export_json">Export JSON</button>
      <button id="backup-btn" class="toolbar-btn-sm" title="Backup all mods to a ZIP archive" data-i18n-title="mods.btn_backup_title" data-i18n="mods.btn_backup">Backup</button>
      <button id="restore-backup-btn" class="toolbar-btn-sm" title="Restore all mods from a PMM Backup ZIP" data-i18n-title="mods.btn_restore_backup_title" data-i18n="mods.btn_restore_backup">Restore Backup</button>
    </div>
  </div>
  <div id="bulk-actions-bar" class="bulk-actions-bar" style="display:none">
    <div class="bulk-actions-info"><span id="bulk-selected-count">0</span> mods selected</div>
    <div class="bulk-actions-buttons">
      <button id="bulk-enable-btn" class="bulk-btn primary" data-i18n="mods.bulk_enable">Enable All</button>
      <button id="bulk-disable-btn" class="bulk-btn" data-i18n="mods.bulk_disable">Disable All</button>
      <button id="bulk-remove-btn" class="bulk-btn danger" data-i18n="mods.bulk_remove">Remove Selected</button>
      <button id="bulk-clear-btn" class="bulk-btn" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>
  <div id="mods-container">
    <div id="empty-state" data-i18n="mods.empty_state">No mods found. Install a mod or configure your game path in Settings.</div>
  </div>
</div>
