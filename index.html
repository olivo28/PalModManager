<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PalModManager</title>
  <link rel="icon" type="image/png" href="/src/assets/logo.png" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <style>
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 16px;
    }

    .loading-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      animation: pulse-glow 1.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 16px rgba(0, 120, 212, 0.4));
    }

    @keyframes pulse-glow {
      from {
        opacity: 0.6;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0078d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: #888;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <!-- LOADING SPLASH SCREEN -->
  <div id="app-loading">
    <img src="/src/assets/logo.png" alt="PalModManager Logo" class="loading-logo" />
    <div class="loading-spinner"></div>
    <div class="loading-text">PalModManager</div>
  </div>

          <span class="sidebar-tab-icon">✎</span>
          <span class="sidebar-tab-label" data-i18n="sidebar.tab_editor">Edit</span>
        </button>
        <button class="sidebar-tab" data-tab="library" title="Mod Library" data-i18n-title="sidebar.tab_library_title" style="position:relative;">

          <span class="sidebar-tab-label" data-i18n="sidebar.tab_library">Library</span>
          <span id="sidebar-library-badge" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;background:#00bcff;border-radius:50%;box-shadow:0 0 6px #00bcff;"></span>

        <button class="sidebar-tab" data-tab="build" title="Mod Packer" data-i18n-title="sidebar.tab_build_title">

          <span class="sidebar-tab-label" data-i18n="sidebar.tab_build">Build</span>
        </button>

          <span class="sidebar-tab-label" data-i18n="sidebar.tab_scanner">Scan</span>
        </button>
        <button class="sidebar-tab" data-tab="db" title="DB Inspector" data-i18n-title="sidebar.tab_db_title">
          <span class="sidebar-tab-icon">🗄</span>
          <span class="sidebar-tab-label" data-i18n="sidebar.tab_db">DB</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <!-- NEXUS PROFILE WIDGET (ABOVE PLAY BUTTON) -->
        <div id="sidebar-nexus-widget" class="sidebar-nexus-widget" style="display:none;" title="Nexus Mods Profile" data-i18n-title="nexus_profile.sidebar_title">
          <div class="sidebar-nexus-avatar-wrap">
            <img id="sidebar-nexus-avatar" src="" alt="Nexus Avatar" class="sidebar-nexus-avatar" />
            <span id="sidebar-nexus-dot" class="sidebar-nexus-dot"></span>
          </div>
          <div class="sidebar-nexus-info">
            <span id="sidebar-nexus-name" class="sidebar-nexus-name"></span>
            <span id="sidebar-nexus-tier" class="sidebar-nexus-tier"></span>
          </div>
        </div>

        <button id="launch-game-btn" class="sidebar-play-btn" title="Launch Palworld" data-i18n-title="sidebar.launch_game_title">
          <span class="sidebar-tab-icon">▶</span>
          <span class="sidebar-tab-label" data-i18n="sidebar.launch_game">Play</span>
        </button>
        <div id="sidebar-version" class="sidebar-version">V1.6.1</div>
        <button id="settings-btn" class="sidebar-btn" title="Settings" data-i18n-title="sidebar.settings_title">⚙</button>
      </div>
    </nav>

    <!-- VIEWS MOUNT POINT -->
    <main id="main-content"></main>
  </div>

  <!-- MODALS & OVERLAYS MOUNT POINT -->
  <div id="modals-root"></div>

  <!-- DROP OVERLAY -->
  <div id="drop-overlay">
    <div id="drop-zone">
      <div class="drop-icon">⊞</div>
      <div class="drop-text" data-i18n="mods.drop_overlay_text">Drop .zip/.rar/.7z to install</div>
    </div>
  </div>

  <!-- CONTEXT MENU OVERLAY -->
  <div id="context-overlay" class="context-overlay">
    <div id="context-menu" class="context-menu" tabindex="-1"></div>
  </div>

  <div id="drag-select-box" class="drag-select-box"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
