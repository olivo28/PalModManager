[package]
name = "palmodmanager"
version = "1.1.0"
edition = "2021"
default-run = "palmodmanager"

[[bin]]
name = "test_zips"
path = "../scratch/test_palvariety_zip.rs"

[[bin]]
name = "test_install_sim"
path = "../scratch/test_installation_simulation.rs"

[[bin]]
name = "test_progressive_weapon"
path = "../scratch/test_progressive_weapon.rs"



[lib]
name = "palmodmanager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hostname = "0.4"
